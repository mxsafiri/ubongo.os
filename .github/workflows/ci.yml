name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check assistant_cli/

      - name: Type check with mypy
        run: mypy assistant_cli/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest -v --tb=short
        continue-on-error: true

  # Build the desktop app's server exactly as the release does and start it
  # on macOS, so a server that can't launch is caught before it ships.
  server-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller

      - name: Build server bundle
        run: pyinstaller desktop/server/ubongo-server.spec --noconfirm

      - name: Smoke-test the bundled server
        run: scripts/smoke_server.sh dist/ubongo-server/ubongo-server
