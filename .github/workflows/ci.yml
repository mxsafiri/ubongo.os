name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check assistant_cli/

      - name: Type check with mypy
        run: mypy assistant_cli/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest -v --tb=short
        continue-on-error: true

  # Build the Mac app exactly as the release does (unsigned): start the
  # packaged server to prove it runs, then build the DMG and keep it as a
  # downloadable artifact so every change can be tried on a real Mac first.
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install server deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller

      - name: Build server bundle
        run: |
          pyinstaller desktop/server/ubongo-server.spec --noconfirm
          rm -rf desktop/src-tauri/binaries/ubongo-server
          mkdir -p desktop/src-tauri/binaries
          cp -R dist/ubongo-server desktop/src-tauri/binaries/ubongo-server

      - name: Smoke-test the bundled server
        run: scripts/smoke_server.sh desktop/src-tauri/binaries/ubongo-server/ubongo-server

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Build the app and DMG
        run: npm run tauri build
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Upload test DMG
        uses: actions/upload-artifact@v4
        with:
          name: ubongo-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
