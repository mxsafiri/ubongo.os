name: Release

on:
  push:
    tags:
      - "v*"
  # "Run workflow" button on the Actions tab: tags the commit it runs on as
  # v<version> and publishes the release, without pushing a tag by hand.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.6.1 (must match desktop/src-tauri/tauri.conf.json)"
        required: true

permissions:
  contents: write

jobs:
  # ── Check the version before spending time on builds ───────────
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and check it matches the app version
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          APP=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          if [ "$TAG" != "v$APP" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $APP"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists — bump the version first"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ── Build Python package (wheel + sdist) ───────────────────────
  python-package:
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
        continue-on-error: true

  # ── Build standalone binaries per platform ─────────────────────
  binaries:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: python scripts/build_binary.py

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/ubongo-*

  # ── Build Tauri desktop app + DMG (macOS only) ─────────────────
  tauri-dmg:
    needs: preflight
    runs-on: macos-latest
    env:
      # Signing and notarization switch on by themselves once the Apple
      # secrets exist (see docs/RELEASING.md); until then builds stay unsigned.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Python server deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          # requirements.txt holds the server's own deps (fastapi, uvicorn,
          # anthropic…) — pyproject.toml alone doesn't, and v0.6.1 shipped
          # a server that crashed on launch because of it.
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller

      - name: Build Python sidecar (ubongo-server)
        run: |
          pyinstaller desktop/server/ubongo-server.spec --noconfirm
          # PyInstaller --onedir produces dist/ubongo-server/{ubongo-server, _internal/...}
          # Copy the ENTIRE folder — the binary alone can't load without _internal/Python.
          rm -rf desktop/src-tauri/binaries/ubongo-server
          mkdir -p desktop/src-tauri/binaries
          cp -R dist/ubongo-server desktop/src-tauri/binaries/ubongo-server
          # Sanity: the Python runtime must be present next to the binary
          test -f desktop/src-tauri/binaries/ubongo-server/ubongo-server
          test -d desktop/src-tauri/binaries/ubongo-server/_internal
          ls -lh desktop/src-tauri/binaries/ubongo-server/ubongo-server
          du -sh desktop/src-tauri/binaries/ubongo-server/_internal

      - name: Import Developer ID certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::APPLE_CERTIFICATE has no 'Developer ID Application' identity"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign the bundled server
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          scripts/macos_sign_server.sh desktop/src-tauri/binaries/ubongo-server \
            "$SIGNING_IDENTITY" desktop/server/entitlements.plist

      # Runs after signing, so it also proves the signed server still starts
      - name: Smoke-test the bundled server
        run: scripts/smoke_server.sh desktop/src-tauri/binaries/ubongo-server/ubongo-server

      - name: Prepare notarization credentials
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          # Tauri notarizes and staples the app when these are set
          {
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Build Tauri app
        run: npm run tauri build
        working-directory: desktop
        env:
          # Developer ID when the certificate secret exists, otherwise ad-hoc ("-")
          APPLE_SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY || '-' }}

      - name: Check the signed app passes Gatekeeper
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          APP=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$HAS_APPLE_NOTARY" = "true" ]; then
            xcrun stapler validate "$APP"
            spctl --assess --type execute --verbose "$APP"
          fi

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(find desktop/src-tauri/target/release/bundle -name "*.dmg" | head -1)
          echo "path=$DMG" >> $GITHUB_OUTPUT
          echo "name=$(basename $DMG)" >> $GITHUB_OUTPUT

      - name: Remove signing keychain
        if: always() && env.HAS_APPLE_CERT == 'true'
        run: security delete-keychain "$KEYCHAIN" || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-dmg
          path: ${{ steps.dmg.outputs.path }}

  # ── Create GitHub Release with all artifacts ───────────────────
  release:
    needs: [preflight, python-package, binaries, tauri-dmg]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run this creates the tag at the commit that was built
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Install

            ### macOS (Apple Silicon M1+)
            Download `ubongo_*.dmg` below, open it and drag ubongo to Applications.
            Open it, pick a name and a tone, and press START. There's no sign-up.

            If macOS says it couldn't verify ubongo, go to
            **System Settings → Privacy & Security → Open Anyway**, or run once:
            ```bash
            xattr -dr com.apple.quarantine /Applications/ubongo.app
            ```

            ### CLI only (all platforms — requires Python 3.11+)
            ```bash
            pip install ubongo
            ```

            ### Standalone binary (no Python needed)
            Download the binary for your OS below, then:
            - **macOS/Linux**: `chmod +x ubongo && ./ubongo start`
            - **Windows**: `ubongo.exe start`
